:host { all: initial; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.root { position: fixed; inset: 0; pointer-events: none; z-index: 2147483646; font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #f4f6fb; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: currentColor; flex: 0 0 auto; }

/* panel */
.panel { position: absolute; left: 3vw; top: max(8px, env(safe-area-inset-top)); width: min(360px, 94vw); pointer-events: auto; display: flex; flex-direction: column;
  background: rgba(8, 9, 14, 0.9); border-radius: 6px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
  animation: in .22s cubic-bezier(.2,1.2,.4,1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); touch-action: manipulation; }
@keyframes in { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
.panel.collapsed .body, .panel.collapsed .desc, .panel.collapsed .tools, .panel.collapsed .sub, .panel.collapsed .sources { display: none; }

/* banner */
.banner { position: relative; height: 64px; display: flex; align-items: center; justify-content: flex-start; padding-left: 16px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(120% 140% at 0% 0%, #3df5a7 0%, transparent 45%), radial-gradient(120% 140% at 100% 100%, #22d3ee 0%, transparent 50%), linear-gradient(135deg, #0f5132, #0b3d52 55%, #241046); overflow: hidden; }
.banner::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px); pointer-events: none; }
.title { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: .02em; color: #fff; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; transform: skewX(-6deg); }
.title small { display: block; font-size: 10px; letter-spacing: .5em; text-align: center; font-style: normal; text-shadow: 1px 1px 0 #000; opacity: .95; margin-top: -2px; }
.hbtns { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; z-index: 1; }
.hbtn { width: 32px; height: 32px; border-radius: 8px; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.hbtn svg { width: 16px; height: 16px; }

/* source chips */
.sources { display: flex; gap: 6px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; background: #050608; }

import json, base64, types, renpy, emscripten
ARGS = json.loads(base64.b64decode('__ARGS__').decode('utf-8'))
try:
    TEXT = (str, unicode)
except NameError:
    TEXT = (str,)
try:
    INTS = (int, long)
except NameError:
    INTS = (int,)
SAFE = 9007199254740991
store = renpy.store

def kind(v):
    if isinstance(v, bool):
        return 'bool'
    if isinstance(v, INTS):
        return 'int'
    if isinstance(v, float):
        return 'float'
    if isinstance(v, TEXT):
        return 'str'
    return None

def leaf(path, v, game, ro=None):
    t = kind(v)
    if t is None:
        return None
    if t == 'str':
        if len(v) > 500:
            return None
        if not isinstance(v, type(u'')):
            v = v.decode('utf-8', 'replace')
    if t == 'int' and abs(v) > SAFE:
        return {'p': path, 't': 'int', 'v': str(v), 'ro': 'a number too large for JavaScript', 'g': game}
    if t == 'float' and (v != v or v in (float('inf'), float('-inf'))):
        return {'p': path, 't': 'float', 'v': str(v), 'ro': 'not a finite number', 'g': game}
    out = {'p': path, 't': t, 'v': v, 'g': game}
    if ro:
        out['ro'] = ro
    return out

def game_names():
    try:
        return set(renpy.python.store_dicts['store'].ever_been_changed)
    except Exception:
        return None

def own_object(v):
    try:
        return hasattr(v, '__dict__') and str(type(v).__module__).startswith('store')
    except Exception:
        return False

def op_list():
    ebc = game_names()
    d = vars(store)
    cap = int(ARGS.get('max', 3000))
    out = []
    names = sorted(k for k in list(d.keys()) if isinstance(k, TEXT) and not k.startswith('_'))
    for k in names:
        game = ebc is not None and k in ebc
        if not game and not ARGS.get('all'):
            continue
        v = d.get(k)
        if isinstance(v, (types.ModuleType, type)) or isinstance(v, (types.FunctionType, types.BuiltinFunctionType, types.MethodType)):
            continue
        l = leaf([['a', k]], v, game)
        if l:
            out.append(l)
        elif isinstance(v, (list, tuple)):
            ro = 'a tuple cannot be changed' if isinstance(v, tuple) else None
            for i, x in enumerate(v[:100]):
                l = leaf([['a', k], ['i', i]], x, game, ro)
                if l:
                    out.append(l)
        elif isinstance(v, dict):
            for kk in list(v.keys())[:100]:
                if isinstance(kk, TEXT) or (isinstance(kk, INTS) and not isinstance(kk, bool)):
                    l = leaf([['a', k], ['k', kk]], v[kk], game)
                    if l:
                        out.append(l)
        elif own_object(v):
            for a in sorted(vars(v).keys())[:100]:
                if isinstance(a, TEXT) and not a.startswith('_'):
                    l = leaf([['a', k], ['a', a]], vars(v)[a], game)
                    if l:
                        out.append(l)
        if len(out) >= cap:
            break
    return {'vars': out[:cap], 'total': len(out), 'version': getattr(renpy, 'version_only', ''), 'name': getattr(renpy.config, 'name', '') or '', 'ebc': (len(ebc) if ebc is not None else None)}

def resolve(path):
    o = store
    for step in path:
        if step[0] == 'a':
            o = getattr(o, step[1])
        elif step[0] == 'i':
            o = o[int(step[1])]
        else:
            o = o[step[1]]
    return o

def op_get():
    vals = []
    for p in ARGS['paths']:
        try:
            l = leaf(p, resolve(p), True)
            vals.append({'ok': True, 'v': l['v'], 't': l['t']} if l else {'ok': False})
        except Exception:
            vals.append({'ok': False})
    return {'values': vals}

def op_set():
    path = ARGS['path']
    value = ARGS['value']
    parent = resolve(path[:-1])
    step = path[-1]
    if isinstance(parent, tuple):
        raise Exception('a tuple cannot be changed')
    if step[0] == 'a':
        cur = getattr(parent, step[1])
    else:
        cur = parent[int(step[1]) if step[0] == 'i' else step[1]]
    t = kind(cur)
    if t is None:
        raise Exception('this is not a simple value')
    if t == 'bool':
        if not isinstance(value, bool):
            raise Exception('the game keeps true/false here')
    elif t == 'int':
        if isinstance(value, bool) or not isinstance(value, (INTS + (float,))) or value != int(value):
            raise Exception('the game keeps a whole number here')
        value = int(value)
    elif t == 'float':
        if isinstance(value, bool) or not isinstance(value, (INTS + (float,))):
            raise Exception('the game keeps a number here')
        value = float(value)
    elif t == 'str':
        if not isinstance(value, TEXT):
            raise Exception('the game keeps text here')
    if step[0] == 'a':
        setattr(parent, step[1], value)
    else:
        parent[int(step[1]) if step[0] == 'i' else step[1]] = value
    try:
        renpy.exports.restart_interaction()
    except Exception:
        pass
    l = leaf(path, resolve(path), True)
    return {'v': l['v'] if l else None}

def node_info(n):
    return {'type': type(n).__name__, 'file': str(getattr(n, 'filename', '') or ''), 'line': int(getattr(n, 'linenumber', 0) or 0)}

def summarize(block):
    out = []
    for x in list(block or [])[:3]:
        t = type(x).__name__
        if t == 'Say':
            out.append({'say': str(getattr(x, 'what', '') or '')[:120]})
        elif t == 'Jump':
            out.append({'jump': str(getattr(x, 'target', '') or '')})
        elif t == 'Python':
            out.append({'py': str(getattr(getattr(x, 'code', None), 'source', '') or '')[:120]})
    return out

def op_input():
    # Input Inspector (2.3.3): the statement Ren'Py is executing (renpy.input waits inside it) and
    # the conditions that follow it, as source text. Nothing is executed.
    ctx = renpy.game.context()
    cur = renpy.game.script.lookup(ctx.current)
    info = node_info(cur)
    try:
        info['source'] = str(cur.code.source)[:500]
    except Exception:
        info['source'] = ''
    checks = []
    steps = []
    n = getattr(cur, 'next', None)
    seen = set()
    while n is not None and len(seen) < 40 and id(n) not in seen:
        seen.add(id(n))
        t = type(n).__name__
        if t == 'If':
            for cond, block in n.entries:
                c = node_info(n)
                c.update({'cond': str(cond)[:400], 'then': summarize(block)})
                checks.append(c)
        elif t == 'While':
            c = node_info(n)
            c.update({'cond': str(n.condition)[:400], 'then': summarize(n.block), 'loop': True})
            checks.append(c)
        elif t == 'Python':
            c = node_info(n)
            c.update({'source': str(getattr(getattr(n, 'code', None), 'source', '') or '')[:300]})
            steps.append(c)
        elif t in ('Jump', 'Return'):
            break
        n = getattr(n, 'next', None)
    return {'current': info, 'checks': checks, 'steps': steps}
