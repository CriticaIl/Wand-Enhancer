<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crystal Quest — SaveForge demo</title>
<link rel="stylesheet" href="../demo.css" />
<script src="lz-string.min.js"></script>
</head>
<body>
<header>SaveForge demo game · imitates RPG Maker MV's public runtime globals ($gameParty, $gameActors, $gameSwitches, $gameVariables, DataManager). It is not RPG Maker.</header>
<main>
  <h1>Crystal Quest</h1>
  <div class="hud">
    <div><span>Gold</span><b id="gold"></b></div>
    <div><span>Reid HP</span><b id="hp"></b></div>
    <div><span>Reid Level</span><b id="level"></b></div>
    <div><span>Potions</span><b id="potions"></b></div>
    <div><span>Bridge open (switch 3)</span><b id="bridge"></b></div>
    <div><span>Quest stage (var 1)</span><b id="stage"></b></div>
  </div>
  <button id="fight">Fight a slime</button>
  <button id="save" class="alt">Save (file 1)</button>
  <p class="log" id="log"></p>
</main>
<script>
  // --- minimal classes with the same field names RPG Maker uses
  function Game_Actor(id, name, hp, mhp, level) { this._actorId = id; this._name = name; this._hp = hp; this._mhpBase = mhp; this._mp = 20; this._level = level; this._exp = { 1: level * 100 }; this._paramPlus = [0, 0, 0, 0, 0, 0, 0, 0]; }
  Game_Actor.prototype.mhp = function () { return this._mhpBase + this._paramPlus[0]; };
  Game_Actor.prototype.refresh = function () { this._hp = Math.max(0, Math.min(this._hp, this.mhp())); };
  Game_Actor.prototype.setHp = function (hp) { this._hp = hp; this.refresh(); };
  Game_Actor.prototype.changeLevel = function (level) { this._level = Math.max(1, Math.min(level, 99)); this._exp[1] = this._level * 100; };
  function Game_Party() { this._gold = 120; this._steps = 0; this._items = { 1: 3, 2: 1 }; this._weapons = {}; this._armors = {}; this._actors = [1]; }
  Game_Party.prototype.gainGold = function (n) { this._gold = Math.max(0, Math.min(this._gold + n, 9999999)); };
  Game_Party.prototype.gainItem = function (item, n) { var id = $dataItems.indexOf(item); this._items[id] = Math.max(0, Math.min((this._items[id] || 0) + n, 99)); };
  window.setterCalls = { gainGold: 0, gainItem: 0, setValue: 0 };
  (function (g, i) { Game_Party.prototype.gainGold = function (n) { setterCalls.gainGold++; return g.call(this, n); }; Game_Party.prototype.gainItem = function (a, b) { setterCalls.gainItem++; return i.call(this, a, b); }; })(Game_Party.prototype.gainGold, Game_Party.prototype.gainItem);
  function Game_Switches() { this._data = [null, false, false, false, false]; }
  Game_Switches.prototype.value = function (id) { return !!this._data[id]; };
  Game_Switches.prototype.setValue = function (id, v) { setterCalls.setValue++; this._data[id] = v; $gameMap.requestRefresh(); };
  function Game_Variables() { this._data = [null, 1, 0, 0]; }
  Game_Variables.prototype.setValue = function (id, v) { setterCalls.setValue++; this._data[id] = v; $gameMap.requestRefresh(); };
  function Game_System() { this._saveCount = 0; this._battleCount = 0; this._winCount = 0; this._escapeCount = 0; }
  function Game_SelfSwitches() { this._data = {}; }

  window.$dataSystem = { switches: ['', 'Met the smith', 'Found the map', 'Bridge open', 'Boss defeated'], variables: ['', 'Quest stage', 'Slimes defeated', 'Reputation'] };
  window.$dataItems = [null, { name: 'Potion' }, { name: 'Ether' }];
  window.$dataWeapons = [null];
  window.$dataArmors = [null];
  window.$gameMap = { refreshes: 0, requestRefresh: function () { this.refreshes++; render(); } };

  var actorsHolder = { _data: [null, new Game_Actor(1, 'Reid', 90, 120, 4)] };
  window.$gameActors = actorsHolder;
  window.$gameParty = new Game_Party();
  window.$gameSwitches = new Game_Switches();
  window.$gameVariables = new Game_Variables();
  window.$gameSystem = new Game_System();
  window.$gameSelfSwitches = new Game_SelfSwitches();

  window.DataManager = {
    makeSaveContents: function () {
      return { system: $gameSystem, switches: $gameSwitches, variables: $gameVariables, selfSwitches: $gameSelfSwitches, actors: $gameActors, party: $gameParty };
    },
  };

  var saved = localStorage.getItem('RPG File1');
  if (saved) {
    var d = JSON.parse(LZString.decompressFromBase64(saved));
    Object.assign($gameParty, d.party); Object.assign($gameSwitches, d.switches); Object.assign($gameVariables, d.variables);
    Object.assign($gameActors._data[1], d.actors._data[1]);
  }

  function render() {
    var a = $gameActors._data[1];
    document.getElementById('gold').textContent = $gameParty._gold;
    document.getElementById('hp').textContent = a._hp + ' / ' + a.mhp();
    document.getElementById('level').textContent = a._level;
    document.getElementById('potions').textContent = $gameParty._items[1] || 0;
    document.getElementById('bridge').textContent = $gameSwitches.value(3) ? 'YES' : 'no';
    document.getElementById('stage').textContent = $gameVariables._data[1];
  }
  setInterval(render, 250);
  render();
  document.getElementById('fight').onclick = function () {
    var a = $gameActors._data[1];
    a._hp = Math.max(0, a._hp - 12); $gameParty.gainGold(15); $gameVariables._data[2] += 1; $gameSystem._battleCount += 1;
    document.getElementById('log').textContent = 'The slime hits for 12. You find 15 gold.';
    render();
  };
  document.getElementById('save').onclick = function () {
    $gameSystem._saveCount += 1;
    localStorage.setItem('RPG File1', LZString.compressToBase64(JSON.stringify(DataManager.makeSaveContents())));
    document.getElementById('log').textContent = 'Saved to file 1.';
  };
</script>
</body>
</html>
