<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Cage Brawler</title>
<!-- Regression fixture (SaveForge 2.3.2): a fighting game hosted on the same game host as a
     SugarCube story (like the games of a portal such as mopoga.com, which share one origin and
     therefore one localStorage). Plain page globals; saves to localStorage "cagebrawler_save". -->
<style>body{margin:0;font:15px system-ui,sans-serif;background:#1a1010;color:#fff}canvas{display:block;width:100%;height:300px;background:#000}</style>
</head>
<body>
<h1>Cage Brawler</h1>
<canvas id="cv" width="360" height="300"></canvas>
<p>Takedown <b id="td"></b> · Chokehold stamina <b id="cs"></b></p>
<button id="save">Save</button>
<script>
  window.fight = { player: { takedown: 3, chokeholdStamina: 40, hp: 100 }, opponent: { hp: 100 }, round: 1, ticks: 0 };
  function render() {
    document.getElementById('td').textContent = fight.player.takedown;
    document.getElementById('cs').textContent = fight.player.chokeholdStamina;
    var x = document.getElementById('cv').getContext('2d');
    x.fillStyle = '#300'; x.fillRect(0, 0, 360, 300); x.fillStyle = '#fff'; x.fillRect(fight.ticks % 360, 140, 12, 12);
  }
  setInterval(function () { fight.ticks++; render(); }, 250);
  render();
  window.brawlerSave = function () { localStorage.setItem('cagebrawler_save', JSON.stringify(fight)); };
  document.getElementById('save').onclick = window.brawlerSave;
</script>
</body>
</html>
